spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:helpsupport_dev;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.filmytell.support: DEBUG
    org.springframework.security: INFO
